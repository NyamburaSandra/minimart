# Project: Marketing & Growth Hackathon - Backend Skeleton (Django + DRF)
# Updated docker-compose.yml and Dockerfile with fixes for Gunicorn & Celery startup

### file: docker-compose.yml
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: hackdb
      POSTGRES_USER: hackuser
      POSTGRES_PASSWORD: hackpass
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  web:
    build:
      context: ./backend
    command: gunicorn marketinghack.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend/marketinghack:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env   # <-- load AT keys, DB URL, etc.
    environment:
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: marketinghack.settings
      DATABASE_URL: postgres://hackuser:hackpass@db:5432/hackdb
      REDIS_URL: redis://redis:6379/0

  worker:
    build:
      context: ./backend
    command: celery -A marketinghack.marketinghack.celery worker -l info
    volumes:
      - ./backend/marketinghack:/app
    depends_on:
      - redis
      - db
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: marketinghack.settings
      DATABASE_URL: postgres://hackuser:hackpass@db:5432/hackdb
      REDIS_URL: redis://redis:6379/0

  beat:
    build:
      context: ./backend
    command: celery -A marketinghack.marketinghack.celery beat -l info
    volumes:
      - ./backend/marketinghack:/app
    depends_on:
      - redis
      - db
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: marketinghack.settings
      DATABASE_URL: postgres://hackuser:hackpass@db:5432/hackdb
      REDIS_URL: redis://redis:6379/0

volumes:
  pgdata:
